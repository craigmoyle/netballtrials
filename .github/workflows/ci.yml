name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netballtrials_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d netballtrials_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=@netball-trials/api -- prisma generate
      - run: npm test
      - run: npm run benchmark:planner --workspace=@netball-trials/api
      - run: npm run build
      - run: npm run test:e2e --workspace=@netball-trials/web
      - run: npm audit
