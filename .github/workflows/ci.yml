name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netballtrials_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d netballtrials_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=@netball-trials/api -- prisma generate
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e --workspace=@netball-trials/web
      - run: npm audit
