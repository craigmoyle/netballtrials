name: Promote Azure TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netballtrials_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d netballtrials_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=@netball-trials/api -- prisma generate
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e --workspace=@netball-trials/web
        env:
          CI: '1'
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netballtrials_test
      - run: npm audit
      - uses: actions/upload-artifact@v7
        with:
          name: netballtrials-test-web
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: azure-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: netballtrials-test-web
          path: apps/web/dist
      - name: Sign in with workload identity federation
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push API and migration images
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
        run: |
          set -euo pipefail
          registry=$(az acr show --subscription "$SUBSCRIPTION_ID" --name "$ACR_NAME" --query loginServer --output tsv)
          az acr login --subscription "$SUBSCRIPTION_ID" --name "$ACR_NAME"
          docker build --platform linux/amd64 --file Dockerfile.azure --target api-runtime --tag "$registry/netballtrials/api:${GITHUB_SHA}" .
          docker push "$registry/netballtrials/api:${GITHUB_SHA}"
          docker build --platform linux/amd64 --file Dockerfile.azure --target api-migrate --tag "$registry/netballtrials/api-migrate:${GITHUB_SHA}" .
          docker push "$registry/netballtrials/api-migrate:${GITHUB_SHA}"
          echo "ACR_LOGIN_SERVER=$registry" >> "$GITHUB_ENV"
      - name: Run database migrations before switching the API revision
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          MIGRATION_JOB_NAME: ${{ vars.AZURE_MIGRATION_JOB_NAME }}
        run: |
          set -euo pipefail
          az containerapp job update \
            --subscription "$SUBSCRIPTION_ID" \
            --resource-group "$RESOURCE_GROUP" \
            --name "$MIGRATION_JOB_NAME" \
            --image "$ACR_LOGIN_SERVER/netballtrials/api-migrate:${GITHUB_SHA}" \
            --container-name migrate
          execution=$(az containerapp job start \
            --subscription "$SUBSCRIPTION_ID" \
            --resource-group "$RESOURCE_GROUP" \
            --name "$MIGRATION_JOB_NAME" \
            --query name --output tsv)
          if [ -z "$execution" ] || [ "$execution" = 'None' ]; then
            execution=$(az containerapp job execution list \
              --subscription "$SUBSCRIPTION_ID" \
              --resource-group "$RESOURCE_GROUP" \
              --name "$MIGRATION_JOB_NAME" \
              --query '[0].name' --output tsv)
          fi
          if [ -z "$execution" ] || [ "$execution" = 'None' ]; then
            echo 'Could not resolve the migration job execution.' >&2
            exit 1
          fi
          for attempt in $(seq 1 90); do
            status=$(az containerapp job execution show \
              --subscription "$SUBSCRIPTION_ID" \
              --resource-group "$RESOURCE_GROUP" \
              --name "$MIGRATION_JOB_NAME" \
              --job-execution-name "$execution" \
              --query properties.status --output tsv 2>/dev/null || true)
            case "$status" in
              Succeeded) echo 'TEST database migrations completed.'; exit 0 ;;
              Failed|Stopped) echo "Migration job ended with status $status." >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo 'Timed out waiting for TEST database migrations.' >&2
          exit 1
      - name: Update API image
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          API_CONTAINER_APP_NAME: ${{ vars.AZURE_API_CONTAINER_APP_NAME }}
        run: |
          set -euo pipefail
          az containerapp update \
            --subscription "$SUBSCRIPTION_ID" \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_CONTAINER_APP_NAME" \
            --image "$ACR_LOGIN_SERVER/netballtrials/api:${GITHUB_SHA}"
          # Keep Azure Static Web Apps linked-backend authentication enabled, but let
          # the API's own allowlist/auth hooks handle anonymous health and signed webhook routes.
          az containerapp auth update \
            --subscription "$SUBSCRIPTION_ID" \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_CONTAINER_APP_NAME" \
            --unauthenticated-client-action AllowAnonymous \
            --require-https true \
            --yes --only-show-errors --output none
          api_fqdn=$(az containerapp show \
            --subscription "$SUBSCRIPTION_ID" \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_CONTAINER_APP_NAME" \
            --query properties.configuration.ingress.fqdn --output tsv)
          for attempt in $(seq 1 36); do
            if curl --silent --show-error --fail "https://${api_fqdn}/health" \
              | jq -e '.appEnv == "testing" and .testAccessRequired == true and .testIntegrationsEnabled == true' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'The promoted TEST API did not become healthy with integration safeguards enabled.' >&2
          exit 1
      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/web/dist
          output_location: ''
          skip_app_build: true
      - name: Verify the linked backend through the TEST web origin
        env:
          WEB_URL: ${{ vars.AZURE_TEST_WEB_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --silent --show-error --fail "${WEB_URL%/}/api/health" \
              | jq -e '.appEnv == "testing" and .testAccessRequired == true and .testIntegrationsEnabled == true' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'The Static Web Apps /api linked backend did not pass its public health check.' >&2
          exit 1
