name: netball

services:
  db:
    image: netball-db:vps
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netball_host_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in the host env file}
      POSTGRES_DB: postgres
      STATS_DB_OWNER_PASSWORD: ${STATS_DB_OWNER_PASSWORD:?Set STATS_DB_OWNER_PASSWORD in the host env file}
      STATS_API_DB_PASSWORD: ${STATS_API_DB_PASSWORD:?Set STATS_API_DB_PASSWORD in the host env file}
      TRIALS_DB_PASSWORD: ${TRIALS_DB_PASSWORD:?Set TRIALS_DB_PASSWORD in the host env file}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      - -c
      - pgaudit.log=ddl,write,role
      - -c
      - pgaudit.log_catalog=off
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=4GB
      - -c
      - max_connections=50
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb/01-create-app-databases.sh:/docker-entrypoint-initdb.d/01-create-app-databases.sh:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netball_host_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - stats_db
      - trials_db

  stats-api:
    image: netballstats-api:vps
    build:
      context: ../../../netballstats
      dockerfile: Dockerfile.azure
    restart: unless-stopped
    environment:
      NETBALL_STATS_REPO_ROOT: /app
      NETBALL_STATS_HOST: 0.0.0.0
      NETBALL_STATS_PORT: "8000"
      NETBALL_STATS_ALLOWED_ORIGINS: https://${STATS_DOMAIN:?Set STATS_DOMAIN in the host env file},https://${STATS_PRIMARY_DOMAIN:?Set STATS_PRIMARY_DOMAIN in the host env file}
      NETBALL_STATS_TESTING_HOSTS: ${STATS_DOMAIN:?Set STATS_DOMAIN in the host env file}
      NETBALL_STATS_DB_BACKEND: postgres
      NETBALL_STATS_DB_HOST: db
      NETBALL_STATS_DB_PORT: "5432"
      NETBALL_STATS_DB_NAME: netballstats
      NETBALL_STATS_DB_USER: netballstats_api
      NETBALL_STATS_DB_PASSWORD: ${STATS_API_DB_PASSWORD:?Set STATS_API_DB_PASSWORD in the host env file}
      NETBALL_STATS_DB_SSLMODE: disable
      NETBALL_STATS_TELEMETRY_DB_HOST: db
      NETBALL_STATS_TELEMETRY_DB_PORT: "5432"
      NETBALL_STATS_TELEMETRY_DB_NAME: netballstats
      NETBALL_STATS_TELEMETRY_DB_USER: netballstats_telemetry_writer
      NETBALL_STATS_TELEMETRY_DB_PASSWORD: ${STATS_TELEMETRY_WRITER_PASSWORD:?Set STATS_TELEMETRY_WRITER_PASSWORD in the host env file}
      NETBALL_STATS_TELEMETRY_DB_SSLMODE: disable
      NETBALL_STATS_TRUST_AZURE_CLIENT_IP: "false"
      NETBALL_STATS_TRUSTED_PROXY_IPS: 172.30.10.2
      NETBALL_STATS_REQUEST_TELEMETRY: "true"
      NETBALL_STATS_BROWSER_APPINSIGHTS_CONNECTION_STRING: ${NETBALL_STATS_BROWSER_APPINSIGHTS_CONNECTION_STRING:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "Rscript", "--no-restore", "--no-save", "-e", "stopifnot(httr::status_code(httr::GET('http://127.0.0.1:8000/health', httr::timeout(2))) == 200L)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    logging: *bounded-logs
    networks:
      stats_proxy:
        ipv4_address: 172.30.10.3
      stats_db:
      stats_egress:

  trials-api:
    image: netballtrials-api:vps
    build:
      context: ../..
      dockerfile: Dockerfile.azure
      target: api-runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: testing
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      ENABLE_TEST_INTEGRATIONS: ${ENABLE_TEST_INTEGRATIONS:-false}
      INFISICAL_API_URL: ${INFISICAL_API_URL:-https://us.infisical.com}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
      DATABASE_URL: postgresql://netballtrials_app:${TRIALS_DB_PASSWORD:?Set TRIALS_DB_PASSWORD in the host env file}@db:5432/netballtrials_test?schema=public
      WEB_ORIGIN: https://${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the host env file}
      API_PUBLIC_URL: https://${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the host env file}
      SESSION_COOKIE_SECURE: "true"
      MAIL_FROM: cmoyle@gmail.com
      MAIL_REPLY_TO: cmoyle@gmail.com
      TRUST_PROXY: 172.30.30.2
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    logging: *bounded-logs
    networks:
      trials_proxy:
        ipv4_address: 172.30.30.3
      trials_db:
      trials_egress:

  web:
    image: netball-sites:vps
    build:
      context: ../../..
      dockerfile: netballtrials/deploy/vps/Dockerfile.site
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    environment:
      STATS_DOMAIN: ${STATS_DOMAIN:?Set STATS_DOMAIN in the host env file}
      STATS_PRIMARY_DOMAIN: ${STATS_PRIMARY_DOMAIN:?Set STATS_PRIMARY_DOMAIN in the host env file}
      TRIALS_DOMAIN: ${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the host env file}
    depends_on:
      - stats-api
      - trials-api
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging: *bounded-logs
    networks:
      edge:
      stats_proxy:
        ipv4_address: 172.30.10.2
      trials_proxy:
        ipv4_address: 172.30.30.2

  stats-full-refresh:
    profiles: [jobs]
    image: netballstats-api:vps
    build:
      context: ../../../netballstats
      dockerfile: Dockerfile.azure
    command: ["Rscript", "--no-restore", "--no-save", "scripts/build_database.R"]
    environment:
      NETBALL_STATS_DB_BACKEND: postgres
      NETBALL_STATS_DB_HOST: db
      NETBALL_STATS_DB_PORT: "5432"
      NETBALL_STATS_DB_NAME: netballstats
      NETBALL_STATS_DB_USER: netballstats_owner
      NETBALL_STATS_DB_PASSWORD: ${STATS_DB_OWNER_PASSWORD:?Set STATS_DB_OWNER_PASSWORD in the host env file}
      NETBALL_STATS_DB_SSLMODE: disable
      R_PROFILE: ""
      R_PROFILE_USER: ""
      RENV_PROFILE_ALLOWED: "false"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 4g
    cpus: 2.0
    logging: *bounded-logs
    networks:
      - stats_db
      - stats_egress

  stats-telemetry-init:
    profiles: [jobs]
    image: netballstats-api:vps
    build:
      context: ../../../netballstats
      dockerfile: Dockerfile.azure
    command: ["Rscript", "--no-restore", "--no-save", "scripts/init_telemetry_store.R"]
    environment:
      NETBALL_STATS_DB_HOST: db
      NETBALL_STATS_DB_PORT: "5432"
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in the host env file}
      STATS_TELEMETRY_WRITER_PASSWORD: ${STATS_TELEMETRY_WRITER_PASSWORD:?Set STATS_TELEMETRY_WRITER_PASSWORD in the host env file}
      STATS_TELEMETRY_REPORT_PASSWORD: ${STATS_TELEMETRY_REPORT_PASSWORD:?Set STATS_TELEMETRY_REPORT_PASSWORD in the host env file}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    logging: *bounded-logs
    networks:
      - stats_db

  stats-telemetry-report:
    profiles: [jobs]
    image: netballstats-api:vps
    user: "0:0"
    build:
      context: ../../../netballstats
      dockerfile: Dockerfile.azure
    command: ["Rscript", "--no-restore", "--no-save", "scripts/weekly_usage_report.R"]
    environment:
      NETBALL_STATS_REPO_ROOT: /app
      NETBALL_STATS_TELEMETRY_DB_HOST: db
      NETBALL_STATS_TELEMETRY_DB_PORT: "5432"
      NETBALL_STATS_TELEMETRY_DB_NAME: netballstats
      NETBALL_STATS_TELEMETRY_DB_SSLMODE: disable
      NETBALL_STATS_TELEMETRY_REPORT_USER: netballstats_telemetry_reporter
      NETBALL_STATS_TELEMETRY_REPORT_PASSWORD: ${STATS_TELEMETRY_REPORT_PASSWORD:?Set STATS_TELEMETRY_REPORT_PASSWORD in the host env file}
      NETBALL_STATS_TELEMETRY_REPORT_DIR: /reports
    volumes:
      - /opt/netball/reports:/reports
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    logging: *bounded-logs
    networks:
      - stats_db

  stats-international-refresh:
    profiles: [jobs]
    image: netballstats-api:vps
    build:
      context: ../../../netballstats
      dockerfile: Dockerfile.azure
    command: ["Rscript", "--no-restore", "--no-save", "scripts/build_international_database.R"]
    environment:
      NETBALL_STATS_DB_BACKEND: postgres
      NETBALL_STATS_DB_HOST: db
      NETBALL_STATS_DB_PORT: "5432"
      NETBALL_STATS_DB_NAME: netballstats
      NETBALL_STATS_DB_USER: netballstats_owner
      NETBALL_STATS_DB_PASSWORD: ${STATS_DB_OWNER_PASSWORD:?Set STATS_DB_OWNER_PASSWORD in the host env file}
      NETBALL_STATS_DB_SSLMODE: disable
      R_PROFILE: ""
      R_PROFILE_USER: ""
      RENV_PROFILE_ALLOWED: "false"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2g
    cpus: 1.0
    logging: *bounded-logs
    networks:
      - stats_db
      - stats_egress

  trials-migrate:
    profiles: [jobs]
    image: netballtrials-migrate:vps
    build:
      context: ../..
      dockerfile: Dockerfile.azure
      target: api-migrate
    environment:
      NODE_ENV: production
      APP_ENV: testing
      PAYMENT_PROVIDER: fake
      ENABLE_TEST_INTEGRATIONS: "false"
      DATABASE_URL: postgresql://netballtrials_app:${TRIALS_DB_PASSWORD:?Set TRIALS_DB_PASSWORD in the host env file}@db:5432/netballtrials_test?schema=public
      WEB_ORIGIN: https://${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the host env file}
      API_PUBLIC_URL: https://${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the host env file}
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY: 172.30.30.2
    depends_on:
      db:
        condition: service_healthy
    logging: *bounded-logs
    networks:
      - trials_db
      - trials_egress

  trials-seed-test:
    profiles: [jobs]
    image: netballtrials-api:vps
    build:
      context: ../..
      dockerfile: Dockerfile.azure
      target: api-runtime
    command: ["npm", "run", "seed:test-dataset"]
    environment:
      NODE_ENV: production
      APP_ENV: testing
      PAYMENT_PROVIDER: fake
      ENABLE_TEST_INTEGRATIONS: "false"
      DATABASE_URL: postgresql://netballtrials_app:${TRIALS_DB_PASSWORD:?Set TRIALS_DB_PASSWORD in the host env file}@db:5432/netballtrials_test?schema=public
      WEB_ORIGIN: https://${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the host env file}
      API_PUBLIC_URL: https://${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the host env file}
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY: 172.30.30.2
    depends_on:
      db:
        condition: service_healthy
    logging: *bounded-logs
    networks:
      - trials_db
      - trials_egress

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  stats_proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24
  stats_db:
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/24
  stats_egress:
    ipam:
      config:
        - subnet: 172.30.21.0/24
  trials_proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.30.30.0/24
  trials_db:
    internal: true
    ipam:
      config:
        - subnet: 172.30.40.0/24
  trials_egress:
    ipam:
      config:
        - subnet: 172.30.41.0/24
  edge:
    ipam:
      config:
        - subnet: 172.30.50.0/24
