name: netball-trials

# Trials TEST runs in its own Compose project. PostgreSQL and the TLS edge come from the netball-vps platform.
services:
  trials-api:
    image: netballtrials-api:vps
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api-runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: testing
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      ENABLE_TEST_INTEGRATIONS: ${ENABLE_TEST_INTEGRATIONS:-false}
      INFISICAL_API_URL: ${INFISICAL_API_URL:-https://us.infisical.com}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
      DATABASE_URL: postgresql://netballtrials_runtime:${TRIALS_RUNTIME_DB_PASSWORD:?Set TRIALS_RUNTIME_DB_PASSWORD in the Trials env file}@db:5432/netballtrials_test?schema=public
      WEB_ORIGIN: https://${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the Trials env file}
      API_PUBLIC_URL: https://${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the Trials env file}
      SESSION_COOKIE_SECURE: "true"
      MAIL_FROM: cmoyle@gmail.com
      MAIL_REPLY_TO: cmoyle@gmail.com
      TRUST_PROXY: 172.30.30.2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      trials_proxy:
        ipv4_address: 172.30.30.3
      trials_db:
      trials_egress:

  trials-web:
    image: netball-trials-web:vps
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.web
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - trials-api
    mem_limit: 128m
    logging: *bounded-logs
    networks:
      edge:
      trials_proxy:
        ipv4_address: 172.30.30.2

  trials-migrate:
    profiles: [jobs]
    image: netballtrials-migrate:vps
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api-migrate
    environment:
      NODE_ENV: production
      APP_ENV: testing
      PAYMENT_PROVIDER: fake
      ENABLE_TEST_INTEGRATIONS: "false"
      DATABASE_URL: postgresql://netballtrials_app:${TRIALS_DB_PASSWORD:?Set TRIALS_DB_PASSWORD in the Trials env file}@db:5432/netballtrials_test?schema=public
      WEB_ORIGIN: https://${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the Trials env file}
      API_PUBLIC_URL: https://${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the Trials env file}
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY: 172.30.30.2
    logging: *bounded-logs
    networks:
      - trials_db
      - trials_egress

  trials-reminders:
    profiles: [jobs]
    image: netballtrials-api:vps
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api-runtime
    command: ["npm", "run", "send-reminders"]
    environment:
      NODE_ENV: production
      APP_ENV: testing
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      ENABLE_TEST_INTEGRATIONS: ${ENABLE_TEST_INTEGRATIONS:-false}
      INFISICAL_API_URL: ${INFISICAL_API_URL:-https://us.infisical.com}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
      DATABASE_URL: postgresql://netballtrials_runtime:${TRIALS_RUNTIME_DB_PASSWORD:?Set TRIALS_RUNTIME_DB_PASSWORD in the Trials env file}@db:5432/netballtrials_test?schema=public
      WEB_ORIGIN: https://${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the Trials env file}
      API_PUBLIC_URL: https://${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the Trials env file}
      SESSION_COOKIE_SECURE: "true"
      MAIL_FROM: cmoyle@gmail.com
      MAIL_REPLY_TO: cmoyle@gmail.com
      TRUST_PROXY: 172.30.30.2
    mem_limit: 512m
    logging: *bounded-logs
    networks:
      - trials_db
      - trials_egress

  trials-retention:
    profiles: [jobs]
    image: netballtrials-api:vps
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api-runtime
    command: ["npm", "run", "retention"]
    environment:
      DATABASE_URL: postgresql://netballtrials_runtime:${TRIALS_RUNTIME_DB_PASSWORD:?Set TRIALS_RUNTIME_DB_PASSWORD in the Trials env file}@db:5432/netballtrials_test?schema=public
    mem_limit: 256m
    logging: *bounded-logs
    networks:
      - trials_db

  trials-seed-test:
    profiles: [jobs]
    image: netballtrials-api:vps
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api-runtime
    command: ["npm", "run", "seed:test-dataset"]
    environment:
      NODE_ENV: production
      APP_ENV: testing
      PAYMENT_PROVIDER: fake
      ENABLE_TEST_INTEGRATIONS: "false"
      DATABASE_URL: postgresql://netballtrials_runtime:${TRIALS_RUNTIME_DB_PASSWORD:?Set TRIALS_RUNTIME_DB_PASSWORD in the Trials env file}@db:5432/netballtrials_test?schema=public
      WEB_ORIGIN: https://${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the Trials env file}
      API_PUBLIC_URL: https://${TRIALS_DOMAIN:?Set TRIALS_DOMAIN in the Trials env file}
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY: 172.30.30.2
    logging: *bounded-logs
    networks:
      - trials_db
      - trials_egress

networks:
  edge:
    name: netball_edge
    external: true
  trials_proxy:
    name: netball_trials_proxy
    external: true
  trials_db:
    name: netball_trials_db
    external: true
  trials_egress:
    name: netball_trials_egress
    external: true
